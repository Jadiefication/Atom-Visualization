[package]
name = "haje"
version = "0.3.0"
edition = "2024"
authors = ["Jadie <jadeczjade008@gmail.com>"]
description = "A linear algebra library, developed by yours truly, and probably not that efficient."
license = "MIT" # Use standard SPDX identifiers
repository = "https://github.com/Jadiefication/Haje"
readme = "README.md"
keywords = ["linear-algebra", "matrix", "simulation"]
categories = ["science", "mathematics"]

[dependencies]
tokio = { version = "1.52.3", optional = true }
wgpu = { version = "29.0.3", optional = true }

[features]
default = []
gpu = ["wgpu", "tokio"]
