[package]
name = "haje"
version = "0.3.0"
edition = "2024"
authors = ["Jadie <jadeczjade008@gmail.com>"]
description = "A high-performance linear algebra and quantum simulation library for Rust."
license = "MIT"
repository = "https://github.com/Jadiefication/Haje"
documentation = "https://docs.rs/haje"
readme = "README.md"
keywords = ["linear-algebra", "matrix", "quantum", "simulation", "gpu"]
categories = ["science", "mathematics", "wasm", "rendering", "concurrency"]

[dependencies]
tokio = { version = "1.52.3", optional = true }
wgpu = { version = "30.0.1", optional = true }

[features]
default = []
gpu = ["wgpu", "tokio"]
